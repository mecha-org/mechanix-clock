name: mechanix-clock
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Ojas <ojasc@ext.mechasystems.com>"
description: Mechanix Clock application
homepage: https://github.com/mecha-org/mechanix-clock.git
license: BSD

# Alarms and timers are kept and rung by mxclockd
# (https://github.com/mineshp-mecha/mxclockd), commit b88c9d3 or later:
# per-alarm snooze (AddAlarm/UpdateAlarm take syyysubu) and timer status
# (ListTimers returns a(ssxs)). Timers ring
# with the daemon's own sound.
# pw-play/paplay play the sound previews in the app.
overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.1
      - mxclockd
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.1)"
      - mxclockd

contents:
  - src: ./stage/bundle/mechanix_clock
    dst: /usr/share/mechanix/mechanix-clock/mechanix_clock
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-clock/lib/libapp.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-clock/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_clock
    file_info:
      mode: 0755
  - src: ./org.mechanix.clock.desktop
    dst: /usr/share/applications/org.mechanix.clock.desktop
  # Alarm and timer sounds, at a fixed path mxclockd can play with the app
  # closed (see lib/core/utils/alarm_sounds.dart).
  - src: ./assets/sounds/*.ogg
    dst: /usr/share/sounds/mechanix/clock/
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.clock.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
